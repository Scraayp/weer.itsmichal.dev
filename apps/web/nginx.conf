server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/ld+json application/manifest+json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Share image and icons: cached, but not immutable because their names don't change.
    location ~* ^/(og-image\.png|icon-\d+\.png|apple-touch-icon\.png|favicon\.(ico|svg))$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback. index.html is never cached so new meta tags reach crawlers straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
